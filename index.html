<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title
    gap: 8px;
      align-items: center;
    }
    .group-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-right: 4px;
      font-weight: 700;
    }
    input[type="text"], input[type="number"], select, button, label.btn {
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    input[type="color"] {
      width: 38px;
      height: 34px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    button, label.btn {
      background: #2563eb;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover, label.btn:hover { background: #1d4ed8; }
    button.btn-new { background: #0d9488; }
    button.btn-new:hover { background: #0f766e; }
    label.btn-logo { background: #7c3aed; }
    label.btn-logo:hover { background: #6d28d9; }
    button.active-tool {
      background: #0284c7;
      outline: 2px solid #7dd3fc;
    }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.download { background: #059669; }
    button.download:hover { background: #047857; }
    input[type="file"] { display: none; }
    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #e2e8f0;
      cursor: pointer;
      user-select: none;
    }
    .canvas-wrap {
      max-width: 960px;
      width: 100%;
      display: flex;
      justify-content: center;
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      touch-action: none;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      max-width: 960px;
      width: 100%;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Photo Text &amp; Logo Editor</h2>

  <div class="panel">
    <div class="row">
      <label class="btn" for="imgInput">1. Photo Upload</label>
      <input type="file" id="imgInput" accept="image/*" />

      <label class="btn btn-logo" for="logoInput">2. Logo Upload (Left)</label>
      <input type="file" id="logoInput" accept="image/*" />

      <span class="group-label">Mode:</span>
      <button id="modeMoveBtn" class="active-tool">Text / Logo Move</button>
      <button id="modePatchColorBtn">Purana Text Mitayein (Color)</button>
      <button id="modePatchBlurBtn">Purana Text Mitayein (Blur)</button>
      <button id="modeEraserBtn">Patch Eraser</button>

      <button id="downloadBtn" class="download" style="margin-left:auto;">Download PNG</button>
    </div>

    <div class="row">
      <span class="group-label">Edit / Replace Text:</span>
      <select id="textSelect" title="Likha hua text chunein">
        <option value="-1">-- Koi Text Select Nahi --</option>
      </select>
      <input type="text" id="textInput" placeholder="Yahan likhein ya purana badlein..." style="min-width: 210px;" />
      <button id="newTextBtn" class="btn-new">+ New Text</button>
      <input type="number" id="sizeInput" value="36" min="12" max="220" style="width: 74px;" title="Font Size" />
      <input type="color" id="colorInput" value="#ffffff" title="Text Color" />
      <select id="fontInput">
        <option value="'Noto Nastaliq Urdu', serif">Urdu (Noto Nastaliq)</option>
        <option value="sans-serif">Sans Serif</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monospace</option>
        <option value="Arial, sans-serif">Arial</option>
      </select>
      <label class="check-label"><input type="checkbox" id="outlineCheck" /> Outline</label>
      <button id="deleteTextBtn" class="danger">Delete Text</button>
    </div>

    <div class="row">
      <span class="group-label">Saya (Shadow):</span>
      <label class="check-label"><input type="checkbox" id="shadowCheck" checked /> Saya On</label>
      <input type="color" id="shadowColorInput" value="#000000" title="Shadow Color" />
      <label class="check-label">Blur <input type="range" id="shadowBlurInput" min="0" max="40" value="10" /></label>
      <label class="check-label">X <input type="range" id="shadowXInput" min="-30" max="30" value="3" style="width:75px;" /></label>
      <label class="check-label">Y <input type="range" id="shadowYInput" min="-30" max="30" value="4" style="width:75px;" /></label>
    </div>
    textSelect.addEventListener("change", () => {
      const idx = parseInt(textSelect.value, 10);
      selectTextAt(Number.isNaN(idx) ? -1 : idx);
    });

    deleteTextBtn.addEventListener("click", () => {
      if (selectedTextIndex >= 0 && texts[selectedTextIndex]) {
        texts.splice(selectedTextIndex, 1);
        selectedTextIndex = texts.length - 1;
        loadSelectedTextIntoInputs();
        render();
      }
    });

    brushSizeInput.addEventListener("input", () => {
      brushSizeVal.textContent = brushSizeInput.value + "px";
    });

    logoSizeInput.addEventListener("input", () => {
      const w = parseInt(logoSizeInput.value, 10);
      logoSizeVal.textContent = w + "px";
      if (logoState.img) {
        const ratio = logoState.img.height / logoState.img.width;
        logoState.width = w;
        logoState.height = Math.round(w * ratio);
        render();
      }
    });

    logoOpacityInput.addEventListener("input", () => {
      logoState.opacity = parseInt(logoOpacityInput.value, 10) / 100;
      render();
    });

    resetLogoPosBtn.addEventListener("click", () => {
      logoState.x = 20;
      logoState.y = 20;
      render();
    });

    removeLogoBtn.addEventListener("click", () => {
      logoState.img = null;
      logoState.selected = false;
      logoInput.value = "";
      render();
    });

    function setMode(mode) {
      currentMode = mode;
      pickingColor = false;
      eyedropBtn.classList.remove("active-tool");
      [modeMoveBtn, modePatchColorBtn, modePatchBlurBtn, modeEraserBtn].forEach(b => b.classList.remove("active-tool"));
      if (mode === "move") modeMoveBtn.classList.add("active-tool");
      if (mode === "patchColor") modePatchColorBtn.classList.add("active-tool");
      if (mode === "patchBlur") modePatchBlurBtn.classList.add("active-tool");
      if (mode === "eraser") modeEraserBtn.classList.add("active-tool");
      canvas.style.cursor = mode === "move" ? "grab" : "crosshair";
      render();
    }

    modeMoveBtn.addEventListener("click", () => setMode("move"));
    modePatchColorBtn.addEventListener("click", () => setMode("patchColor"));
    modePatchBlurBtn.addEventListener("click", () => setMode("patchBlur"));
    modeEraserBtn.addEventListener("click", () => setMode("eraser"));

    eyedropBtn.addEventListener("click", () => {
      setMode("patchColor");
      pickingColor = true;
      eyedropBtn.classList.add("active-tool");
      canvas.style.cursor = "copy";
    });

    clearPatchBtn.addEventListener("click", () => {
      pCtx.clearRect(0, 0, patchCanvas.width, patchCanvas.height);
      render();
    });

    function drawPlaceholder() {
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Pehle ek photo upload karein", canvas.width / 2, canvas.height / 2);
      ctx.textAlign = "start";
    }

    function render(isExporting = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        drawPlaceholder();
      }

      ctx.drawImage(patchCanvas, 0, 0);

      if (logoState.img) {
        ctx.save();
        ctx.globalAlpha = logoState.opacity;
        ctx.shadowColor = "rgba(0,0,0,0.35)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.drawImage(logoState.img, logoState.x, logoState.y, logoState.width, logoState.height);
        ctx.restore();

        if (!isExporting && logoState.selected && currentMode === "move") {
          ctx.save();
          ctx.strokeStyle = "#a855f7";
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 4]);
          ctx.strokeRect(logoState.x - 3, logoState.y - 3, logoState.width + 6, logoState.height + 6);
          ctx.restore();
        }
      }

      texts.forEach((item, idx) => {
        ctx.save();
        ctx.font = `${item.fontSize}px ${item.fontFamily}`;
        ctx.textBaseline = "top";

        if (item.shadow) {
          ctx.shadowColor = item.shadowColor;
          ctx.shadowBlur = item.shadowBlur;
          ctx.shadowOffsetX = item.shadowX;
          ctx.shadowOffsetY = item.shadowY;
        }

        if (item.outline) {
          ctx.lineWidth = Math.max(2, Math.round(item.fontSize / 12));
          ctx.strokeStyle = "#0f172a";
          ctx.strokeText(item.text, item.x, item.y);
        }

        ctx.fillStyle = item.color;
        ctx.fillText(item.text, item.x, item.y);
        ctx.restore();

        if (!isExporting && idx === selectedTextIndex && currentMode === "move") {
          ctx.save();
          ctx.font = `${item.fontSize}px ${item.fontFamily}`;
          const w = Math.max(40, ctx.measureText(item.text).width);
          const h = item.fontSize * 1.25;
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.strokeRect(item.x - 4, item.y - 2, w + 8, h + 4);
          ctx.restore();
        }
      });
    }
    imgInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          const maxW = 1200;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          patchCanvas.width = canvas.width;
          patchCanvas.height = canvas.height;
          pCtx.clearRect(0, 0, patchCanvas.width, patchCanvas.height);

          render();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    logoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const w = parseInt(logoSizeInput.value, 10) || 110;
          const ratio = img.height / img.width;
          logoState.img = img;
          logoState.x = 20;
          logoState.y = 20;
          logoState.width = w;
          logoState.height = Math.round(w * ratio);
          logoState.selected = true;
          selectedTextIndex = -1;
          loadSelectedTextIntoInputs();
          setMode("move");
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
    }

    function applyPatchAt(x, y) {
      const radius = parseInt(brushSizeInput.value, 10) / 2;
      if (currentMode === "patchColor") {
        pCtx.save();
        pCtx.globalCompositeOperation = "source-over";
        pCtx.fillStyle = patchColorInput.value;
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      } else if (currentMode === "patchBlur") {
        const size = radius * 2;
        const sx = Math.max(0, x - radius);
        const sy = Math.max(0, y - radius);
        pCtx.save();
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.clip();
        pCtx.filter = "blur(8px)";
        pCtx.drawImage(canvas, sx, sy, size, size, sx, sy, size, size);
        pCtx.restore();
      } else if (currentMode === "eraser") {
        pCtx.save();
        pCtx.globalCompositeOperation = "destination-out";
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
      render();
    }

    function onPointerDown(clientX, clientY) {
      const pos = getCanvasCoords(clientX, clientY);
      isPointerDown = true;

      if (pickingColor) {
        const px = Math.min(canvas.width - 1, Math.max(0, Math.floor(pos.x)));
        const py = Math.min(canvas.height - 1, Math.max(0, Math.floor(pos.y)));
        const data = ctx.getImageData(px, py, 1, 1).data;
        patchColorInput.value = rgbToHex(data[0], data[1], data[2]);
        pickingColor = false;
        eyedropBtn.classList.remove("active-tool");
        canvas.style.cursor = "crosshair";
        isPointerDown = false;
        return;
      }

      if (currentMode !== "move") {
        applyPatchAt(pos.x, pos.y);
        return;
      }

      let hitTextIdx = -1;
      for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        ctx.font = `${t.fontSize}px ${t.fontFamily}`;
        const w = Math.max(40, ctx.measureText(t.text).width);
        const h = t.fontSize * 1.25;
        if (pos.x >= t.x - 4 && pos.x <= t.x + w + 4 && pos.y >= t.y - 2 && pos.y <= t.y + h + 2) {
          hitTextIdx = i;
          break;
        }
      }

      if (hitTextIdx >= 0) {
        selectedTextIndex = hitTextIdx;
        logoState.selected = false;
        dragTarget = "text";
        offsetX = pos.x - texts[hitTextIdx].x;
        offsetY = pos.y - texts[hitTextIdx].y;
        loadSelectedTextIntoInputs();
        render();
        return;
      }

      if (
        logoState.img &&
        pos.x >= logoState.x &&
        pos.x <= logoState.x + logoState.width &&
        pos.y >= logoState.y &&
        pos.y <= logoState.y + logoState.height
      ) {
        selectedTextIndex = -1;
        logoState.selected = true;
        dragTarget = "logo";
        offsetX = pos.x - logoState.x;
        offsetY = pos.y - logoState.y;
        loadSelectedTextIntoInputs();
        render();
        return;
      }

      selectedTextIndex = -1;
      logoState.selected = false;
      dragTarget = null;
      loadSelectedTextIntoInputs();
      render();
    }

    function onPointerMove(clientX, clientY) {
      if (!isPointerDown) return;
      const pos = getCanvasCoords(clientX, clientY);

      if (currentMode !== "move") {
        applyPatchAt(pos.x, pos.y);
        return;
      }

      if (dragTarget === "text" && selectedTextIndex >= 0) {
        texts[selectedTextIndex].x = pos.x - offsetX;
        texts[selectedTextIndex].y = pos.y - offsetY;
        render();
      } else if (dragTarget === "logo" && logoState.img) {
        logoState.x = pos.x - offsetX;
        logoState.y = pos.y - offsetY;
        render();
      }
    }

    function onPointerUp() {
      isPointerDown = false;
      dragTarget = null;
    }

    canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onPointerUp);

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0 && isPointerDown) {
        e.preventDefault();
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener("touchend", onPointerUp);

    downloadBtn.addEventListener("click", () => {
      render(true);
      const link = document.createElement("a");
      link.download = "edited-photo.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      render(false);
    });

    drawPlaceholder();
  </script>
</body>
        </html>
